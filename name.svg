<svg width="100%" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated gradient for name -->
    <linearGradient id="grad">
      <stop offset="0%" stop-color="#ff00cc">
        <animate attributeName="stop-color"
          values="#ff00cc;#00ccff;#ff00cc"
          dur="4s"
          repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ccff">
        <animate attributeName="stop-color"
          values="#00ccff;#ff00cc;#00ccff"
          dur="4s"
          repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- CENTER -->
  <g transform="translate(500 130)">

    <!-- OUTER WIDE ORBIT -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite" />

      <text x="0"   y="-85" font-size="18">✨</text>
      <text x="220" y="-35" font-size="16">⭐</text>
      <text x="260" y="0"   font-size="18">✦</text>
      <text x="220" y="35"  font-size="16">⭐</text>
      <text x="0"   y="85"  font-size="18">❄</text>
      <text x="-220" y="35" font-size="16">✧</text>
      <text x="-260" y="0"  font-size="18">✨</text>
      <text x="-220" y="-35" font-size="16">✦</text>
    </g>

    <!-- MIDDLE WIDE ORBIT -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="12s"
        repeatCount="indefinite" />

      <text x="0"   y="-60" font-size="14">✦</text>
      <text x="170" y="-25" font-size="14">✧</text>
      <text x="200" y="0"   font-size="14">⭐</text>
      <text x="170" y="25"  font-size="14">✧</text>
      <text x="0"   y="60"  font-size="14">✦</text>
      <text x="-170" y="25" font-size="14">✧</text>
      <text x="-200" y="0"  font-size="14">⭐</text>
      <text x="-170" y="-25" font-size="14">✧</text>
    </g>

    <!-- NAME -->
    <text
      text-anchor="middle"
      y="15"
      font-size="56"
      font-weight="700"
      fill="url(#grad)"
      font-family="Segoe UI, Arial, sans-serif">
      Sanji Krishna M P
    </text>

  </g>
</svg>
