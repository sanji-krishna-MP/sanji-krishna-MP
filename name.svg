<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for name -->
    <linearGradient id="textGradient">
      <stop offset="0%" stop-color="#ff00cc">
        <animate attributeName="stop-color"
          values="#ff00cc;#00ccff;#ff00cc"
          dur="4s"
          repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ccff">
        <animate attributeName="stop-color"
          values="#00ccff;#ff00cc;#00ccff"
          dur="4s"
          repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- CENTER -->
  <g transform="translate(450 110)">

    <!-- OUTER ORBIT (large) -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="14s"
        repeatCount="indefinite" />

      <text x="0" y="-90" font-size="18">✨</text>
      <text x="75" y="-50" font-size="16">⭐</text>
      <text x="90" y="0" font-size="18">✦</text>
      <text x="75" y="50" font-size="16">⭐</text>
      <text x="0" y="90" font-size="18">❄</text>
      <text x="-75" y="50" font-size="16">✧</text>
      <text x="-90" y="0" font-size="18">✨</text>
      <text x="-75" y="-50" font-size="16">✦</text>
    </g>

    <!-- MIDDLE ORBIT -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="10s"
        repeatCount="indefinite" />

      <text x="0" y="-65" font-size="14">✦</text>
      <text x="55" y="-35" font-size="14">✧</text>
      <text x="65" y="0" font-size="14">⭐</text>
      <text x="55" y="35" font-size="14">✧</text>
      <text x="0" y="65" font-size="14">✦</text>
      <text x="-55" y="35" font-size="14">✧</text>
      <text x="-65" y="0" font-size="14">⭐</text>
      <text x="-55" y="-35" font-size="14">✧</text>
    </g>

    <!-- INNER ORBIT -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="6s"
        repeatCount="indefinite" />

      <text x="0" y="-40" font-size="12">✦</text>
      <text x="35" y="0" font-size="12">✧</text>
      <text x="0" y="40" font-size="12">✦</text>
      <text x="-35" y="0" font-size="12">✧</text>
    </g>

    <!-- NAME -->
    <text
      text-anchor="middle"
      y="15"
      font-size="52"
      font-weight="700"
      fill="url(#textGradient)"
      font-family="Segoe UI, Arial, sans-serif">
      Sanji Krishna M P
    </text>

  </g>
</svg>

